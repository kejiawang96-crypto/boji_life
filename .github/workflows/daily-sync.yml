name: Daily health sync

# Runs the SynFit (Xunji) daily sync: fetches yesterday + today workouts,
# updates data/daily, regenerates reports, commits and pushes when changed.
# The SynFit API key must be stored as the XUNJI_API_KEY repository secret
# (Settings -> Secrets and variables -> Actions). It is never committed.

on:
  schedule:
    # 03:30 UTC = 22:30 America/Chicago (CDT)
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install chart dependencies
        run: pip install matplotlib

      - name: Check XUNJI_API_KEY secret
        run: |
          if [ -z "${{ secrets.XUNJI_API_KEY }}" ]; then
            echo "::error::XUNJI_API_KEY secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "health-log-sync"
          git config user.email "health-log-sync@users.noreply.github.com"

      - name: Write SynFit API key (outside the repo)
        run: |
          mkdir -p ~/.config/xunji
          printf '%s' "${{ secrets.XUNJI_API_KEY }}" > ~/.config/xunji/api_key
          chmod 600 ~/.config/xunji/api_key

      - name: Run daily sync
        env:
          HEALTH_LOG_TZ: America/Chicago
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/health-daily-sync.py --force-refresh
        # --force-refresh: always re-fetch from the API. Without it, a second
        # run on the same day reuses the same-day cache and would miss
        # workouts logged after the first run.
